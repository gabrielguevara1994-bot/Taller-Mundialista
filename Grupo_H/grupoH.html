<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial 2026 - Grupo H</title>
    <link rel="stylesheet" href="grupoH.css">
    <!-- Fuente moderna estilo deportivo -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <span class="world-cup-text">FIFA WORLD CUP</span>
            <span class="year-text">2026</span>
        </div>
        <p class="subtitle">FASE DE GRUPOS</p>
    </header>

    <main class="container">
        <section class="group-card">
            <div class="group-header">
                <h2>GRUPO H</h2>
            </div>

            <div class="teams-grid">
                <!-- Equipo 1: España -->
                <article class="team-card">
                    <div class="flag-container">
                        <img src="../Imagenes/España.png" alt="Bandera de España" class="flag-img">
                    </div>
                    <span class="team-name">España</span>
                </article>

                <!-- Equipo 2: Cabo Verde -->
                <article class="team-card">
                    <div class="flag-container">
                        <img src="../Imagenes/Cabo Verde.jpg" alt="Bandera de Cabo Verde" class="flag-img">
                    </div>
                    <span class="team-name">Cabo Verde</span>
                </article>

                <!-- Equipo 3: Arabia Saudita -->
                <article class="team-card">
                    <div class="flag-container">
                        <img src="../Imagenes/Arabia Saudita.png" alt="Bandera de Arabia Saudita" class="flag-img">
                    </div>
                    <span class="team-name">Arabia Saudita</span>
                </article>

                <!-- Equipo 4: Uruguay -->
                <article class="team-card">
                    <div class="flag-container">
                        <img src="../Imagenes/Uruguay.png" alt="Bandera de Uruguay" class="flag-img">
                    </div>
                    <span class="team-name">Uruguay</span>
                </article>
            </div>
        </section>
    </main>

</body>
</html>
